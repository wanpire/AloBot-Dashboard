{% extends "base.html" %}
{% block heading %}تغییر رمز عبور{% endblock %}
{% block content %}
<div class="card">
  <form method="post" action="/password">
    <label>رمز فعلی <input type="password" name="current" autocomplete="current-password" required></label>
    <label>رمز جدید <input type="password" name="new" autocomplete="new-password" minlength="12" required></label>
    <label>تکرار رمز جدید <input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
    <p class="hint">با تغییر رمز، نشست‌های دیگر شما بسته می‌شوند؛ همین نشست باز می‌ماند.</p>
    <button class="btn btn--primary" type="submit">ذخیره</button>
  </form>
</div>
{% endblock %}
